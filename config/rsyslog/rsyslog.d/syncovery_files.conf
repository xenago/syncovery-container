# Use imfile with freshStartTail to avoid dupes
# https://www.rsyslog.com/doc/reference/parameters/imfile-freshstarttail.html#param-imfile-freshstarttail

input(type="imfile"
      File="/config/.Syncovery/Syncovery.cfg-log.txt"
      Tag="cfg"
      freshStartTail="on")

input(type="imfile"
      File="/config/.Syncovery/Syncovery.ini-log.txt"
      Tag="ini"
      freshStartTail="on")

input(type="imfile"
      File="/config/.Syncovery/WebGUI.log"
      Tag="webgui"
      freshStartTail="on")
