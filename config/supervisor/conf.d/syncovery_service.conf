[program:syncovery]
directory = /syncovery
command = /syncovery/SyncoveryCL
; Syncovery logs via syslog and its own log files (tailed by rsyslog imfile).
; Its console stdout is a verbose interactive status that duplicates those sources in fragmented lines so it's omitted.
; stderr is kept via syslog to surface any startup errors.
stdout_logfile = /dev/null
stdout_logfile_maxbytes = 0
stderr_syslog = true
killasgroup = true
stopasgroup = true
autostart = false
autorestart = true
startsecs = 0
stopwaitsecs = 30
