name: Build image

#
# Build and publish the multi-arch image
# - Pull requests into dev and manual runs perform builds and validate, but don't publish
# - A smoke test brings the stack up and waits for the container to report healthy
# - Publishing to the GitHub Container Registry @ ghcr.io happens only on a version tag push to main:
#   each arch is built natively and pushed by digest, then merged into one multi-arch manifest
#

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'  # Syncovery version tags, e.g. 11.16.2
  pull_request:
    branches: [dev]  # validate bump PRs into dev; main builds only on a tag
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

# Cancel superseded PR/dispatch runs; never cancel an in-progress release (tag) run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Build each architecture on a native runner.
  # On PRs and manual runs, validate the build
  # On a tag, push by digest so the merge job can assemble a single manifest list
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write  # push image blobs by digest (tag builds only)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # full history required for the on-main check before a push
        with:
          fetch-depth: 0

      - name: Prepare platform slug
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      # Don't push unless it is a tag on main
      - name: Verify the tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main; refusing to publish."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} is contained in main."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker labels and annotations
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # PR / manual run: build the arch to confirm it compiles, without pushing.
      - name: Build (validate only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.platform.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.slug }}

      - name: Log in to registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag push: build and push by digest (no tag applied yet).
      # oci-mediatypes keeps the annotations through the manifest merge.
      # no-cache so each release installs current Debian packages instead of reusing stale apt layers.
      - name: Build and push by digest
        id: build
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          no-cache: true

      - name: Export digest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.platform.outputs.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Sanity check: bring the full stack up and wait for the Syncovery container to report healthy.
  # On a tag push, this pulls and runs the amd64 image produced by the build job.
  # PR/manual runs build locally instead.
  smoke:
    needs: [build]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read  # pull the amd64 image by digest (tag builds only)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare env
        run: |
          cp .env.example .env
          # Create the required machine-id file (empty; the container populates it on first start)
          mkdir -p ./data
          touch ./data/machine-id

      - name: Log in to registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the amd64 digest
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v8
        with:
          name: digests-linux-amd64
          path: ${{ runner.temp }}/digests

      # Pull the exact image the build job pushed and point compose at it via SYNCOVERY_IMAGE,
      # rather than building a second time
      - name: Pull the published amd64 image by digest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          digest=$(ls "${RUNNER_TEMP}/digests")
          image="${REGISTRY}/${IMAGE_NAME}@sha256:${digest}"
          docker pull "$image"
          docker tag "$image" syncovery-smoke:test
          echo "SYNCOVERY_IMAGE=syncovery-smoke:test" >> .env

      - name: Start the stack (pulled image)
        if: startsWith(github.ref, 'refs/tags/')
        run: docker compose up -d

      - name: Start the stack (local build)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: docker compose up -d --build

      - name: Wait for the syncovery container to be healthy
        run: |
          set -euo pipefail
          # Stream container logs live alongside the polling output below; stop it once this step ends
          docker compose logs -f --no-color &
          trap 'kill "$!" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' syncovery-container 2>/dev/null || echo missing)
            echo "[$i] syncovery-container health: $status"
            if [ "$status" = healthy ]; then
              echo "Container is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "::error::syncovery-container did not become healthy within the timeout."
          exit 1

      - name: Dump status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  # Assemble the per-arch digests into one manifest list, tag it, and publish the release.
  merge:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write  # Create the GitHub Release
      packages: write  # Publish to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history and tags for the on-main and newest-version checks

      # A tag can point at any commit; only publish when it is contained in main.
      - name: Verify the tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main; refusing to publish."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} is contained in main."

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Only move "latest" when this release is the highest version, so tagging an
      # older patch after a newer release does not roll latest backwards.
      - name: Determine if this is the newest release
        id: latest
        run: |
          set -euo pipefail
          highest=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ "$highest" = "${GITHUB_REF_NAME}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive image tags and annotations
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The first tag sets the version annotation
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.is_latest == 'true' }}
            type=sha

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Combine the per-arch digests into one tagged, annotated manifest list.
      # Build the argument list in an array so tags and annotations are quoted safely.
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r t; do args+=(-t "$t"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r a; do args+=(--annotation "$a"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for f in *; do args+=("${REGISTRY}/${IMAGE_NAME}@sha256:$f"); done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect the published image
        env:
          TAG: ${{ github.ref_name }}
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${TAG}"

      # Assemble the release text
      - name: Create release notes
        env:
          TAG: ${{ github.ref_name }}
          IS_LATEST: ${{ steps.latest.outputs.is_latest }}
        run: |
          set -euo pipefail
          repo_name=${GITHUB_REPOSITORY##*/}
          image="${REGISTRY}/${GITHUB_REPOSITORY}"
          notes="${RUNNER_TEMP}/release-notes.md"
          {
            echo "Containerized Syncovery \`${TAG}\`."
            echo
            echo "## Container image"
            echo
            echo "Published to the [GitHub Container Registry](https://github.com/${GITHUB_REPOSITORY}/pkgs/container/${repo_name})."
            echo
            echo '```'
            echo "docker pull ${image}:${TAG}"
            if [ "${IS_LATEST}" = "true" ]; then
              echo "docker pull ${image}:latest"
            fi
            echo '```'
            echo
            echo "Full Syncovery version history: <https://www.syncovery.com/detailed-version-history/>"
          } > "$notes"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          make_latest: ${{ steps.latest.outputs.is_latest }}
