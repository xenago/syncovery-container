# Sample nginx reverse proxy to place in front of the Syncovery container.
#
# The container serves the Syncovery web UI over plain HTTP on port 8999, so a proxy terminates
# TLS, forwards requests, and (recommended) restricts access to trusted networks. The same ideas
# apply if you adapt this to Apache, Caddy, Traefik, and so on.
#
# Replace syncovery.example.com, the certificate paths, the upstream address, and the trusted
# CIDRs with your own values.

upstream syncovery_backend {
    # Address of the container as reachable from the proxy (compose service name, or host:port)
    server    syncovery-container:8999;
    keepalive 8;
}

# Redirect plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name syncovery.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name syncovery.example.com;

    ssl_certificate     /etc/ssl/certs/syncovery.example.com.crt;
    ssl_certificate_key /etc/ssl/private/syncovery.example.com.key;

    # If another load balancer sits in front and sets X-Forwarded-For, recover the real client IP:
    #set_real_ip_from 10.0.0.0/8;
    #real_ip_header X-Forwarded-For;
    #real_ip_recursive on;

    # Security and hygiene headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    proxy_hide_header X-Powered-By;

    # Allow large backup-related operations and long-running requests
    client_max_body_size 1024M;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;

    # Forward the client details to the backend
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Restrict access to trusted networks.
    # Syncovery should not be exposed to the public internet.
    # Replace these CIDRs with your own internal ranges.
    location / {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://syncovery_backend;
    }
}
